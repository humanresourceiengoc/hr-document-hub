<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Document Template Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; padding: 20px; color: #1e293b; }
        .dashboard { max-width: 1200px; margin: 0 auto; display: none; }
        
        /* Header & Search */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 35px; border-radius: 20px; margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.3);
        }
        .header h1 { font-size: 26px; margin-bottom: 8px; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 15px; flex-wrap: wrap; }
        .search-input { flex: 1; min-width: 280px; padding: 14px 20px; border-radius: 12px; border: 1px solid #e2e8f0; outline: none; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        /* Stats Bar */
        .stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 25px; }
        .stat-box { background: white; border-radius: 15px; padding: 20px; text-align: center; border: 1px solid #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .stat-num { font-size: 32px; font-weight: 700; color: #667eea; }
        .stat-label { font-size: 11px; color: #64748b; text-transform: uppercase; font-weight: 700; margin-top: 5px; }

        /* Grid */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        @media (max-width: 850px) { .grid { grid-template-columns: 1fr; } .stats-bar { grid-template-columns: 1fr 1fr; } }

        /* Cards */
        .card { background: white; border-radius: 18px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; }
        .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; border-bottom: 2px solid #f8fafc; padding-bottom: 15px; }
        .card-title { font-weight: 700; font-size: 17px; color: #1e293b; }

        .doc-item { display: flex; align-items: center; gap: 12px; padding: 14px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 10px; }
        .doc-name { font-weight: 600; font-size: 14px; flex: 1; }
        
        .btn-link { font-size: 12px; text-decoration: none; padding: 8px 16px; border-radius: 8px; background: #667eea; color: white; border: none; cursor: pointer; font-weight: 600; }
        .btn-link.has-link { background: #10b981; }

        .note-box { margin-top: 20px; background: #fffbeb; padding: 15px; border-radius: 12px; border-left: 5px solid #f59e0b; }
        .note-box textarea { width: 100%; min-height: 80px; border: none; background: transparent; font-family: inherit; font-size: 13px; outline: none; color: #92400e; margin-top: 5px; }

        /* Login Overlay */
        #login-overlay { position: fixed; inset: 0; background: linear-gradient(135deg, #667eea, #764ba2); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 45px; border-radius: 25px; text-align: center; max-width: 420px; width: 90%; box-shadow: 0 25px 60px rgba(0,0,0,0.3); }
        .btn-google { background: white; border: 1px solid #dadce0; padding: 14px; border-radius: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 12px; margin: 30px auto; width: 100%; justify-content: center; font-size: 16px; }

        #sync-toast { position: fixed; bottom: 20px; right: 20px; background: #1e293b; color: white; padding: 10px 20px; border-radius: 30px; font-size: 12px; opacity: 0; transition: 0.3s; z-index: 1000; }
    </style>
</head>
<body>

    <div id="sync-toast">Saving changes...</div>

    <!-- LOGIN SCREEN -->
    <div id="login-overlay">
        <div class="login-card">
            <div style="font-size: 60px; margin-bottom: 20px;">🔐</div>
            <h2>HR Hub Master Portal</h2>
            <p style="color: #64748b; margin-top: 8px;">Log in to access documents and records.</p>
            <button class="btn-google" onclick="signInWithGoogle()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
                Sign in with Google
            </button>
            <div id="error-msg" style="color: #ef4444; font-weight: 600; font-size: 13px; margin-top: 15px;"></div>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div class="dashboard" id="dashboard-ui">
        <div class="top-bar">
            <input type="text" class="search-input" placeholder="🔍 Search document or category..." oninput="searchDocs(this.value)">
            <button onclick="signOut()" style="background: #fee2e2; color: #991b1b; border: none; padding: 12px 24px; border-radius: 12px; cursor: pointer; font-weight: 700;">Sign Out</button>
        </div>

        <div class="header">
            <h1>📋 Human Resource Document Template Hub</h1>
            <p>Official master repository for all department templates and forms.</p>
        </div>

        <div class="stats-bar">
            <div class="stat-box"><div class="stat-num" id="stat-total">0</div><div class="stat-label">Total Docs</div></div>
            <div class="stat-box"><div class="stat-num" id="stat-linked">0</div><div class="stat-label">With Links</div></div>
            <div class="stat-box"><div class="stat-num">7</div><div class="stat-label">Main Groups</div></div>
            <div class="stat-box"><div class="stat-num" id="stat-notes">0</div><div class="stat-label">Notes Active</div></div>
        </div>

        <div class="grid" id="content-grid"></div>
    </div>

    <script>
        // ======= TAMANG CONFIGURATION (Project: ed893) =======
        const firebaseConfig = {
            apiKey: "AIzaSyCNwgdPiaX9bXEQIVrUlFdXGzbYIWPWW-0",
            authDomain: "hr-document-hub-ed893.firebaseapp.com",
            projectId: "hr-document-hub-ed893",
            storageBucket: "hr-document-hub-ed893.firebasestorage.app",
            messagingSenderId: "940782500305",
            appId: "1:940782500305:web:37980edb858426c12548f0"
        };

        const ADMIN_EMAILS = ['humanresource.iengoc@gmail.com', 'admn.iencc@gmail.com'];

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let appData = {
            recruit: { title: "Recruitment", icon: "🎯", docs: [{name: "Interview Script", link: ""}, {name: "JD - HR", link: ""}, {name: "JD - Accounting", link: ""}, {name: "JD - Sales", link: ""}, {name: "Background Check", link: ""}], notes: "" },
            onboard: { title: "Onboarding", icon: "🚀", docs: [{name: "Employment Contract", link: ""}, {name: "Employee Info Sheet", link: ""}, {name: "Handbook Ack.", link: ""}, {name: "Onboarding Checklist", link: ""}], notes: "" },
            offboard: { title: "Offboarding", icon: "🚪", docs: [{name: "Resignation Acceptance", link: ""}, {name: "Exit Interview", link: ""}, {name: "Asset Return", link: ""}, {name: "Quitclaim", link: ""}], notes: "" },
            files: { title: "201 Records", icon: "📁", docs: [{name: "Employee Profile", link: ""}, {name: "Promotion Letter", link: ""}, {name: "Performance Eval", link: ""}], notes: "" },
            discipline: { title: "Discipline", icon: "⚖️", docs: [{name: "Notice to Explain", link: ""}, {name: "Incident Report", link: ""}, {name: "Warning Letter", link: ""}], notes: "" },
            attendance: { title: "Attendance", icon: "⏰", docs: [{name: "Time Record (DTR)", link: ""}, {name: "OT Form", link: ""}, {name: "Shift Schedule", link: ""}], notes: "" },
            leave: { title: "Leave Credits", icon: "🌴", docs: [{name: "Leave Application", link: ""}, {name: "Credit Tracker", link: ""}, {name: "Medical Cert.", link: ""}], notes: "" }
        };

        // ======= AUTH LOGIC =======
        auth.onAuthStateChanged(async user => {
            if (user) {
                const email = user.email.toLowerCase();
                if (ADMIN_EMAILS.includes(email)) {
                    initializeDashboard();
                } else {
                    const doc = await db.collection('approvedUsers').doc(email).get();
                    if (doc.exists) initializeDashboard();
                    else {
                        document.getElementById('error-msg').textContent = "Unauthorized Account. Contact Admin.";
                        setTimeout(() => auth.signOut(), 3000);
                    }
                }
            } else {
                document.getElementById('login-overlay').style.display = 'flex';
                document.getElementById('dashboard-ui').style.display = 'none';
            }
        });

        function signInWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(e => document.getElementById('error-msg').textContent = e.message);
        }

        function signOut() { auth.signOut().then(() => location.reload()); }

        // ======= CORE LOGIC =======
        function initializeDashboard() {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('dashboard-ui').style.display = 'block';

            db.collection('hrHub').doc('sharedData').onSnapshot(doc => {
                if (doc.exists) {
                    appData = JSON.parse(doc.data().json);
                    renderUI();
                } else { saveToFirebase(); }
            });
        }

        function renderUI() {
            const grid = document.getElementById('content-grid');
            grid.innerHTML = '';
            Object.keys(appData).forEach(key => {
                const cat = appData[key];
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <div class="card-header"><span style="font-size: 24px;">${cat.icon}</span><div class="card-title">${cat.title}</div></div>
                    <div class="doc-list">
                        ${cat.docs.map((d, i) => `
                            <div class="doc-item">
                                <div class="doc-name">${d.name}</div>
                                <button onclick="setLink('${key}', ${i})" class="btn-link ${d.link ? 'has-link' : ''}">${d.link ? 'Open →' : '+ Link'}</button>
                            </div>
                        `).join('')}
                    </div>
                    <div class="note-box"><label style="font-size:10px; font-weight:800; color:#b45309;">NOTES</label>
                    <textarea onblur="saveNotes('${key}', this.value)" placeholder="Enter notes...">${cat.notes || ''}</textarea></div>
                `;
                grid.appendChild(div);
            });
            updateStats();
        }

        function setLink(key, idx) {
            const current = appData[key].docs[idx].link;
            const link = prompt("Paste Document Link (URL):", current);
            if (link !== null) {
                appData[key].docs[idx].link = link.trim();
                saveToFirebase();
                if (link.trim()) window.open(link.trim(), '_blank');
            }
        }

        function saveNotes(key, val) {
            if (appData[key].notes === val) return;
            appData[key].notes = val;
            saveToFirebase();
        }

        function saveToFirebase() {
            const toast = document.getElementById('sync-toast');
            toast.style.opacity = 1;
            db.collection('hrHub').doc('sharedData').set({ json: JSON.stringify(appData) })
                .then(() => setTimeout(() => toast.style.opacity = 0, 800));
        }

        function updateStats() {
            let total = 0, linked = 0, notes = 0;
            Object.values(appData).forEach(c => {
                total += c.docs.length;
                linked += c.docs.filter(d => d.link).length;
                if (c.notes.trim()) notes++;
            });
            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-linked').textContent = linked;
            document.getElementById('stat-notes').textContent = notes;
        }

        function searchDocs(q) {
            const cards = document.querySelectorAll('.card');
            cards.forEach(c => {
                const text = c.innerText.toLowerCase();
                c.style.display = text.includes(q.toLowerCase()) ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>
